<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente del Curso de Informática</title>
  <link rel="icon" type="image/png" href="images/logo.png"> <!-- favicon -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    /* Banner institucional */
    .banner {
      width: 100%;
      background: linear-gradient(90deg, #003366, #0055a5);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 15px;
    }
    .banner img {
      max-height: 80px;
      margin-right: 20px;
    }
    .banner-text h1 {
      margin: 0;
      font-size: 22px;
    }
    .banner-text h2 {
      margin: 0;
      font-size: 14px;
      font-weight: normal;
    }
    .chat-container {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    .messages {
      border: 1px solid #ddd;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    .user-message {
      background-color: #e0e0e0;
      padding: 8px;
      border-radius: 10px;
      margin: 5px 0;
      text-align: right;
    }
    .assistant-message {
      background-color: #007bff;
      color: #fff;
      padding: 8px;
      border-radius: 10px;
      margin: 5px 0;
      text-align: left;
    }
    .typing {
      font-style: italic;
      color: #555;
      margin: 5px 0;
    }
    .input-container {
      display: flex;
      margin-top: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      margin-left: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    footer {
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
      transition: color 0.3s;
    }

    /* Modo oscuro */
    body.dark {
      background-color: #121212;
      color: #e0e0e0;
    }
    body.dark .chat-container {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    body.dark .messages {
      background-color: #2a2a2a;
      border-color: #444;
    }
    body.dark .user-message {
      background-color: #444;
      color: #fff;
    }
    body.dark .assistant-message {
      background-color: #0055a5;
    }
    body.dark footer {
      color: #aaa;
    }
  </style>
</head>
<body>
  <!-- Banner institucional -->
  <div class="banner">
    <img src="images/logo.png" alt="Logo Misión Monotécnica Nº71">
    <div class="banner-text">
      <h1>Misión Monotécnica Nº71 – Curso de Informática</h1>
      <h2>Sede Fray Mamerto Esquiú | Instructor: José Emmanuel Sandoval – Tapso, Catamarca</h2>
    </div>
  </div>

  <div class="chat-container">
    <h3>Tu asistente virtual</h3>
    
    <div class="messages" id="chat-box"></div>
    <div id="typing-indicator" class="typing" style="display:none;">El asistente está escribiendo...</div>
    
    <div class="input-container">
      <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
      <button onclick="sendMessage()">Enviar</button>
      <button onclick="clearChat()">Limpiar</button>
      <button onclick="toggleDarkMode()">Modo Oscuro</button>
    </div>

    <footer>
      © 2026 Misión Monotécnica Nº71 – Curso de Informática | Punto Digital Tapso
    </footer>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const typingIndicator = document.getElementById("typing-indicator");

    // Cargar historial desde localStorage
    window.onload = () => {
      const savedChat = localStorage.getItem("chatHistory");
      if (savedChat) chatBox.innerHTML = savedChat;

      const darkMode = localStorage.getItem("darkMode");
      if (darkMode === "enabled") {
        document.body.classList.add("dark");
      }
    };

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const userMessage = input.value.trim();
      if (!userMessage) return;

      chatBox.innerHTML += "<p class='user-message'>" + userMessage + "</p>";
      saveChat();

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      typingIndicator.style.display = "block";

      const response = await fetch("/.netlify/functions/assistant", {
        method: "POST",
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.json();

      typingIndicator.style.display = "none";
      chatBox.innerHTML += "<p class='assistant-message'>" + data.reply + "</p>";
      saveChat();

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearChat() {
      chatBox.innerHTML = "";
      localStorage.removeItem("chatHistory");
    }

    function saveChat() {
      localStorage.setItem("chatHistory", chatBox.innerHTML);
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      if (document.body.classList.contains("dark")) {
        localStorage.setItem("darkMode", "enabled");
      } else {
        localStorage.setItem("darkMode", "disabled");
      }
    }
  </script>
</body>
</html>
